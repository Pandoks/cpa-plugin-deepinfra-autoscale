<style>

  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 48px; }
  /* NOTE: the management panel floats its toolbar over the top-right of embedded plugin pages. */
  .embedded .wrap { padding-top: 64px; }
  .sub { color: var(--muted); font-size: 12px; }
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .app { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
  .bar { position: relative; display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 10px 14px; border-bottom: 1px solid var(--border); }

  .rel { position: relative; }
  .banner { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 14px; border-bottom: 1px solid var(--border); font-size: 12px; }
  .banner.err { color: var(--err); } .banner.warn { color: var(--warn); }
  .banner:has(#keybox:not([hidden])) #banner-text { line-height: 24px; } #keybox { flex-basis: 100%; display: inline-flex; gap: 10px; align-items: center; }

  .banner:has(+ .list:empty + .empty[hidden]) { border-bottom: 0; }
  .embedded .bar:has(#gearbox[hidden]) { position: absolute; width: 1px; height: 1px; min-height: 0; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); } /* keeps the h1 */
  .embedded { scroll-padding-top: 64px; }
  #banner-text { min-width: 0; overflow-wrap: anywhere; } #keybox { max-width: 100%; flex-wrap: wrap; } .banner input { min-width: 0; flex: 1 1 120px; max-width: 320px; }
  .banner .btn { color: var(--text); padding: 2px 9px; }

  .list { list-style: none; margin: 0; padding: 6px; }
  .list:empty { padding: 0; }
  .empty { margin: 0; padding: 14px; color: var(--muted); }

  .dot.unk { border-style: dashed; }

  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .dot.start { animation: none; } }
  .line1 { display: flex; gap: 8px; align-items: center; min-width: 0; min-height: 24px; } .row { container-type: inline-size; }
  /* The ID, then the facts, on one clipped line: the facts show whole or wrap out of view; the ID can't wrap (the empty

  .tail { display: flex; flex-wrap: wrap; align-items: center; flex: 1 1 0; min-width: 0; height: 16px; line-height: 16px; overflow: hidden; } .tail::before { content: ""; flex: 0 0 0; height: 16px; } /* a first line with height, so wrapped facts sit below it */
  .tail > .idf { flex: 100 1 min(24ch, 100%) !important; max-width: max-content; } .tail > .meta:not(.idf) { flex: 0 0 auto; } .row.named .name { max-width: 55cqw; flex-shrink: 0; } /* a display name caps at a share of the row, not of what the time slot leaves, so it never re-truncates; the ID gives way */
  .name { border-radius: 4px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; min-height: 24px; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; }
  .meta { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .idf { flex: 0 1 auto !important; } .idf:not([hidden]) + .meta { margin-left: 3px; } .idf:not([hidden]) + .meta::before { content: "· " / ""; } /* the dot goes with the facts, so a cut ID can't hide it */ /* the dot's spacing, not the gap's */
  .meta.err { color: var(--err); } .meta.warn { color: var(--warn); }
  .swap { min-width: 4.6em; } .row > div > div.meta { margin-right: calc(-4.6em - 10px); } /* the second line runs under the time slot */ /* room for Copied/Waking…/Sleeping…, so the facts don't slide or blink */
  @keyframes again { from { background: color-mix(in srgb, currentColor 16%, transparent); } } .row.again > div > .meta { animation: again 1.2s ease-out; border-radius: 3px; width: fit-content; padding: 0 4px; margin-left: -4px; } /* the same problem, again */
  /* The last-used time, replaced by the action on hover or focus. */
  .swap { display: grid; justify-items: end; min-height: 24px; } .swap > * { grid-area: 1 / 1; align-self: center; }
  .swap .t { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; pointer-events: none; }
  .tog { position: relative; }
  .tog { opacity: 0; pointer-events: none; }
  .row:has(:focus-visible) .tog { opacity: 1; pointer-events: auto; } .row:has(:focus-visible) .t { opacity: 0; }
  html.mouse .row:not(.noact):not(.copied):hover .tog { opacity: 1; pointer-events: auto; } html.mouse .row:not(.noact):not(.copied):hover .t { opacity: 0; } /* a mouse that moved: a tap's hover mustn't reveal Wake under the tap */
  .row.noact .t, .row.copied .t { opacity: 1; } .row.copied .tog { opacity: 0; } .row.copied:has(.tog:focus-visible) .tog { opacity: 1; } .row.copied:has(.tog:focus-visible) .t { opacity: 0; }
  @media (pointer: coarse) { .tog::after { content: ""; position: absolute; inset: -8px; } }

  .menu, .pop, .results { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); }
  .menu { position: fixed; z-index: 10; min-width: 170px; max-width: min(260px, calc(100vw - 16px)); padding: 4px; }
  .menu button { display: block; width: 100%; overflow-wrap: anywhere; text-align: left; background: none; border: 0; padding: 6px 8px; border-radius: 5px; cursor: pointer; }
  .menu button:hover { background: var(--hover); }
  .menu button:focus-visible { background: var(--hover); outline: 2px solid var(--text); outline-offset: -2px; }
  .menu .danger { color: var(--err); } .menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
  .pop { position: absolute; z-index: 10; right: 0; top: calc(100% + 6px); width: 360px; padding: 12px; display: grid; grid-template-columns: 1fr 120px; gap: 10px 12px; align-items: center; }
  .pop .msg { grid-column: 1 / -1; }
  .pop > div { min-width: 0; } .pop .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } /* a status can't push the controls; whole in its tooltip */
  .pop:has(> .msg:empty) { padding-bottom: 2px; }
  .msg { font-size: 12px; } .msg.err { color: var(--err); } .msg.warn { color: var(--warn); }

  dialog { width: min(680px, calc(100vw - 24px)); max-height: calc(100vh - 64px); margin: 48px auto auto; padding: 0; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
  .embedded dialog { margin-top: 64px; max-height: calc(100vh - 76px); }
  dialog::backdrop { background: rgba(0, 0, 0, .45); } [data-theme=dark] dialog::backdrop { background: rgba(0, 0, 0, .65); }
  dialog form { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 14px 14px 0; }
  dialog form > * { min-width: 0; }

  .dhead { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; margin: -14px -14px -9px; padding: 14px 14px 9px; background: var(--panel); border-bottom: 1px solid transparent; } .scrolled .dhead { border-bottom-color: var(--border); /* a divider once content scrolls under it */ } .dhead h2 { font-size: 14px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .results { margin-top: 4px; padding: 4px; box-shadow: none; }
  #d-body[inert], #res.dim { opacity: .5; } #d-search { position: relative; } #d-search.over .results { position: absolute; left: 0; right: 0; z-index: 4; box-shadow: var(--shadow); max-height: 50vh; overflow: auto; } /* over the filled form, which stays */

  .opt[aria-selected=true] { background: var(--hover); } .opt[aria-selected=true] { box-shadow: inset 2px 0 0 var(--text); } /* not by tint alone */
  .opt .id { font-family: var(--mono); font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .opt .r { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; min-width: 4.7em; text-align: right; }
  .opt[aria-selected=true] .r { color: var(--text); }
  .fields { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  input, select { height: 32px; }
  input { text-overflow: ellipsis; }
  @media (pointer: coarse) { input, select, textarea { font-size: 16px; } } /* iOS zooms into smaller fields */
  #f-think-box { align-self: end; }
  .check { display: flex; gap: 6px; align-items: center; height: 32px; margin: 0; font-size: 13px; color: var(--text); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip:hover { border-color: var(--muted); color: var(--text); }
  .chip { display: inline-flex; gap: 6px; align-items: center; padding: 3px 8px; font-size: 12px; color: var(--muted); border: 1px solid var(--field); border-radius: 6px; background: none; cursor: pointer; }
  .chip[aria-pressed=true] { color: var(--text); background: var(--hover); border-color: var(--text); }
  .chip[aria-pressed=true]:hover { background: color-mix(in srgb, var(--text) 13%, transparent); }
  .chip.busy { border-style: dashed; } /* none free right now */
  details > summary { cursor: pointer; color: var(--muted); font-size: 12px; width: max-content; min-height: 24px; display: flex; align-items: center; gap: 4px; }
  details > summary::before, .more-link::before { content: ""; width: 5px; height: 5px; margin: 0 3px 0 1px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg); transition: transform .12s; }
  details[open] > summary::before { transform: translate(1px, -2px) rotate(45deg); } details > summary::-webkit-details-marker { display: none; } details > summary { list-style: none; }
  details[open] > summary { margin-bottom: 8px; }
  .sec { display: grid; gap: 6px; margin-top: 12px; }
  .link { min-height: 24px; background: none; border: 0; padding: 0; color: var(--muted); font-size: 12px; text-decoration: underline; cursor: pointer; justify-self: start; }
  /* T3 Code's dialog footer: the message left, then Cancel and the primary button on the right. */
  .foot { position: sticky; bottom: 0; z-index: 3; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 0 -14px; padding: 10px 14px 14px; background: var(--panel); border-top: 1px solid var(--border); }
  .foot { justify-content: flex-end; }
  .foot:has(#save[hidden]) { border-top: 0; padding-top: 0; }
  .foot:has(#save[hidden]):has(.msg:empty) { padding-bottom: 2px; }
  .foot .msg { flex: 1; min-width: 0; line-height: 18px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; } /* full text in its tooltip */
  .foot .msg[tabindex] { cursor: pointer; border-radius: 4px; } .foot .msg[tabindex]:focus-visible { outline-offset: 3px; }
  .foot .msg[tabindex]:focus::after { content: attr(data-full) / ""; position: absolute; left: 14px; right: 14px; bottom: calc(100% + 4px); padding: 8px 10px 0; background: var(--panel); border: 0 solid transparent; border-bottom-width: 8px; border-radius: 8px; box-shadow: 0 0 0 1px var(--border), 0 4px 16px rgb(0 0 0 / .18); white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--lines, 12); overflow: hidden; } /* a cut-off message, whole over the form for keyboard and touch; the footer doesn't move */
  .foot .msg:empty { min-height: 0; } /* kept in the page, so its first message is heard */
  /* Errors clamp to 2 lines like the rest (full text in the tooltip), so the footer never grows. */
  .foot > .btn { align-self: flex-start; margin-top: 4px; } /* level with a message's first line; a longer one grows below */
  .foot #remove { margin: 4px auto 0 -6px; padding: 4px 6px; } /* its text lines up with the fields; its ring clears the edge */
  .foot:not(:has(#save[hidden])) .msg { display: -webkit-box; min-height: 36px; align-content: center; } /* 2 lines reserved: the buttons never move */
  dialog { scroll-padding: 56px 0 6rem; overflow-anchor: none; }
  @media (max-height: 480px) { dialog { margin-top: 8px; max-height: calc(100vh - 16px); } #d-search .results, #d-search.over .results { max-height: 35vh; overflow: auto; } } /* 400% zoom: room for the header, a field and the footer */ /* clear of the sticky header and footer (the bottom follows the footer, in dMsg) */
  input:focus-visible, select:focus-visible, textarea:focus-visible { outline-offset: -2px; } /* inset, so sticky parts can't cut it */
  .link, details > summary { border-radius: 4px; } details > summary, .more-link { padding: 0 4px; margin-left: -4px; }
  #f-why:empty { min-height: 1lh; } /* the line Hugging Face fills doesn't push the dialog down */
  .chips .brk { flex-basis: 100%; height: 0; }
  .btn:disabled, .icon:disabled { opacity: .5; cursor: default; }
  #f-gpus[aria-invalid=true] .chip:not([data-more]) { border-color: var(--err); }
  select { padding-left: 6px; }
  .name { padding: 0 4px; margin: 0 -4px; } /* room for the focus ring */ .name:focus-visible { outline-offset: -1px; }
  #f-gpus-l { margin-bottom: -3px; } /* 3px above its chips, like field labels */
  .opt .id { white-space: normal; overflow-wrap: anywhere; } /* whole: the end of an id tells copies apart */
  /* Rows at rest read quieter than running or starting ones, as T3 Code mutes settled threads. */
  .row.rest .name { color: color-mix(in srgb, var(--text) 75%, var(--muted)); } .row.rest:hover .name, .row.rest:has(:focus-visible) .name { color: var(--text); }
  [aria-invalid=true] { border-color: var(--err); } [aria-invalid=true]:focus-visible { outline-color: var(--err); }
  summary:hover, .link:hover { color: var(--text); }
  .more-link { text-decoration: none; display: flex; align-items: center; gap: 4px; } .more-link[aria-expanded=true] { margin-bottom: 8px; } .more-link[aria-expanded=true]::before { transform: translate(1px, -2px) rotate(45deg); } /* the same chevron as Advanced */
  .wide { grid-column: span 2; } #f-id-box.full { grid-column: 1 / -1; }
  #f-spec-json { margin-top: 10px; }
  #f-why.warn { color: var(--warn); } #f-why.err { color: var(--err); } #f-why .link { color: inherit; }
  /* Narrow: rows keep one line, facts cut off; the popover spans the bar. */
  @media (max-width: 600px) {

    .bar h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } /* the cost stays on the line */
    .bar:has(#gearbox[hidden]) { position: absolute; width: 1px; height: 1px; min-height: 0; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); }
    .rel { position: static; } .bar .pop { left: 8px; right: 8px; width: auto; }

  }

    .foot { flex-wrap: nowrap; } #cancel { display: none; } /* ✕, Esc and the backdrop close it */
  }
  @media (forced-colors: active) {
    .dot, .dot.run, .dot.start, .dot.fail { forced-color-adjust: none; border-color: CanvasText; } /* visible on either system background */
    .chip[aria-pressed=true] { outline: 2px solid CanvasText; }
    .menu button:focus, .opt[aria-selected=true] { outline: 2px solid Highlight; }

<body>
<main class="wrap">
  <div class="app">
    <div class="bar">
      <h1>DeepInfra Autoscale</h1>
      <span class="grow"></span>
