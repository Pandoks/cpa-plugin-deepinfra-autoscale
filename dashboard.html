<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepInfra Autoscale</title>
<style>
  /* NOTE: the management panel's palettes; data-theme mirrors the panel's (none = light). */
  :root {
    --bg: #f0eee8; --panel: #faf9f5; --panel2: #fffdf9; --border: #e3e1db;
    --text: #2d2a26; --muted: #6d6760; --accent: #8b8680; --accent-h: #7f7a74;
    --green: #10b981; --amber: #d97706; --red: #c65746; --gray: #a29c95;
  }
  [data-theme=white] {
    --bg: #fff; --panel: #fff; --panel2: #f6f6f6; --border: #e5e5e5;
  }
  [data-theme=dark] {
    --bg: #151412; --panel: #1d1b18; --panel2: #262320; --border: #3a3530;
    --text: #f6f4f1; --muted: #9c958d; --accent: #8b8680; --accent-h: #9a948e;
    --amber: #f59e0b; --gray: #9c958d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between;
    padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  /* NOTE: the management panel floats its toolbar over the top-right of embedded plugin pages. */
  .embedded header { padding-right: 220px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  h2 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; }
  .head-right { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .cost { text-align: right; }
  .cost b { font-size: 20px; font-variant-numeric: tabular-nums; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px; display: grid; gap: 24px; }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input[type=text], input[type=password], select {
    width: 100%; background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; font: inherit; min-width: 0;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  input.attn { outline: 2px solid var(--red); border-color: transparent; }
  .keybox { width: 260px; }
  .keybox.hidden { display: none; }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 12px; font: inherit; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--accent-h); border-color: var(--accent-h); }
  button.danger { color: var(--red); }
  button.danger:hover:not(:disabled) { border-color: var(--red); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px 14px; }
  .check { display: flex; align-items: center; gap: 8px; padding-top: 22px; }
  .check input { width: auto; }
  .check label { margin: 0; color: var(--text); font-size: 13px; }
  .note { margin: 0 0 14px; padding: 8px 12px; border-left: 3px solid var(--amber); background: color-mix(in srgb, var(--amber) 8%, transparent); color: var(--text); font-size: 13px; border-radius: 0 6px 6px 0; }
  .msg { margin-top: 10px; font-size: 13px; min-height: 18px; }
  .msg.ok { color: var(--green); } .msg.err { color: var(--red); }
  .banner { padding: 10px 14px; border-radius: 6px; background: color-mix(in srgb, var(--red) 12%, transparent); border: 1px solid var(--red); color: var(--red); display: none; }
  .banner.show { display: block; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  td.mono, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  .muted { color: var(--muted); }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid; white-space: nowrap; }
  .badge.green { color: var(--green); border-color: color-mix(in srgb, var(--green) 40%, transparent); background: color-mix(in srgb, var(--green) 10%, transparent); }
  .badge.amber { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 40%, transparent); background: color-mix(in srgb, var(--amber) 10%, transparent); }
  .badge.red { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); background: color-mix(in srgb, var(--red) 10%, transparent); }
  .badge.gray { color: var(--gray); border-color: color-mix(in srgb, var(--gray) 40%, transparent); background: color-mix(in srgb, var(--gray) 10%, transparent); }
  .actions { display: flex; gap: 6px; white-space: nowrap; }
  .empty { padding: 28px; text-align: center; color: var(--muted); }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 12px; flex-wrap: wrap; }
  .toolbar h2 { margin: 0; }
  .row-err { color: var(--red); font-size: 12px; margin-top: 2px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>DeepInfra Autoscale</h1>
    <div class="sub">Self-hosted model management</div>
  </div>
  <div class="head-right">
    <div class="keybox" id="keybox">
      <label for="key">Management key</label>
      <input id="key" type="password" autocomplete="off" placeholder="Bearer token" spellcheck="false">
    </div>
    <div class="cost">
      <div class="sub">Running now (est.)</div>
      <b id="cost">$0.00</b><span class="sub">/hr</span>
    </div>
  </div>
</header>

<main>
  <div id="banner" class="banner" role="alert"></div>

  <section>
    <div class="toolbar">
      <h2>Models</h2>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="sub" id="meta"></span>
        <button id="refresh" type="button">Refresh</button>
      </div>
    </div>
    <div class="tablewrap" id="list"></div>
  </section>

  <section>
    <h2>Settings</h2>
    <form id="settings" autocomplete="off">
      <div class="grid">
        <div><label for="s-key">DeepInfra API key</label><input id="s-key" type="password" autocomplete="new-password" spellcheck="false" placeholder="Not set"></div>
        <div><label for="s-idle">Scale to zero after idle (minutes)</label><input id="s-idle" type="text" inputmode="numeric" placeholder="30"></div>
      </div>
      <div style="margin-top:14px;display:flex;align-items:center;gap:12px">
        <button class="primary" id="s-save" type="submit">Save settings</button>
        <span id="s-msg" class="msg" style="margin:0"></span>
      </div>
    </form>
  </section>

  <section>
    <h2>Add model</h2>
    <p class="note">Creating a model provisions GPUs on DeepInfra and bills while running; models scale to zero after the idle window.</p>
    <form id="form" autocomplete="off">
      <div class="grid">
        <div><label for="f-id">Model id *</label><input id="f-id" type="text" required placeholder="red-snow-5.3-flash"></div>
        <div><label for="f-name">Name in Claude Code</label><input id="f-name" type="text" maxlength="64" placeholder="RED-SNOW 5.3 Flash"></div>
        <div><label for="f-repo">HF repo *</label><input id="f-repo" type="text" required placeholder="Blackfrost-AI/RED-SNOW-5.3-FLASH-NVFP4"></div>
        <div><label for="f-rev">Revision (commit sha)</label><input id="f-rev" type="text" placeholder="optional"></div>
        <div><label for="f-gpu">GPU *</label><select id="f-gpu" required><option value="">Loading...</option></select></div>
        <div><label for="f-ctx">Context length *</label><input id="f-ctx" type="text" required placeholder="1M, 256k or 1048576"></div>
        <div><label for="f-quant">Quantization</label><input id="f-quant" type="text" placeholder="fp8"></div>
        <div><label for="f-tool">Tool parser</label><input id="f-tool" type="text" placeholder="glm47"></div>
        <div><label for="f-reason">Reasoning parser</label><input id="f-reason" type="text" placeholder="glm45"></div>
        <div class="check"><input id="f-think" type="checkbox"><label for="f-think">Enable thinking</label></div>
        <div><label for="f-gen">Default sampling (JSON)</label><input id="f-gen" type="text" placeholder='{"presence_penalty":1.5}'></div>
        <div><label for="f-spec">Speculative decoding (JSON)</label><input id="f-spec" type="text" placeholder='{"method":"dflash","model":"Owner/Draft","num_speculative_tokens":8}'></div>
      </div>
      <div style="margin-top:14px;display:flex;align-items:center;gap:12px">
        <button class="primary" id="submit" type="submit">Add model</button>
        <span id="formmsg" class="msg" style="margin:0"></span>
      </div>
    </form>
  </section>
</main>

<script>
(function () {
  "use strict";
  var API = "/v0/management/deepinfra-autoscale";
  var KEY_NAME = "cpa_mgmt_key";
  var $ = function (id) { return document.getElementById(id); };
  var keyInput = $("key");
  var state = { models: [], gpus: [], idle: null, busy: {}, rowErr: {} };
  var gpuSig = "";

  if (window.self !== window.top) document.documentElement.classList.add("embedded");
  syncTheme();
  // Reuse the panel's login when it was saved with "Remember password"; otherwise ask once.
  var fromPanel = panelKey();
  if (fromPanel) {
    keyInput.value = fromPanel;
    $("keybox").classList.add("hidden");
  } else {
    try { keyInput.value = localStorage.getItem(KEY_NAME) || ""; } catch (e) {}
  }

  // panelKey decodes the management key the panel saves in localStorage (same origin). The panel
  // XORs it with a host-derived secret: "enc::v2::" uses the host, the older "enc::v1::" also the
  // user agent.
  function panelKey() {
    try {
      var raw = localStorage.getItem("cli-proxy-auth");
      if (!raw) return "";
      var v1 = raw.indexOf("enc::v1::") === 0;
      if (v1 || raw.indexOf("enc::v2::") === 0) {
        var secret = new TextEncoder().encode("cli-proxy-api-webui::secure-storage|" + location.host + (v1 ? "|" + navigator.userAgent : ""));
        var bytes = atob(raw.slice(9));
        var out = new Uint8Array(bytes.length);
        for (var i = 0; i < bytes.length; i++) out[i] = bytes.charCodeAt(i) ^ secret[i % secret.length];
        raw = new TextDecoder().decode(out);
      }
      var auth = JSON.parse(raw);
      return (auth && auth.state && typeof auth.state.managementKey === "string") ? auth.state.managementKey : "";
    } catch (e) {
      return "";
    }
  }

  function syncTheme() {
    var root = document.documentElement;
    var panel = null;
    try { panel = window.self !== window.top ? window.parent.document.documentElement : null; } catch (e) {}
    if (panel) {
      var copy = function () {
        var theme = panel.getAttribute("data-theme");
        if (theme) root.setAttribute("data-theme", theme); else root.removeAttribute("data-theme");
      };
      copy();
      new MutationObserver(copy).observe(panel, { attributes: true, attributeFilter: ["data-theme"] });
      return;
    }
    var dark = window.matchMedia("(prefers-color-scheme: dark)");
    var follow = function () {
      root.setAttribute("data-theme", dark.matches ? "dark" : "white"); // the panel's "auto" theme
    };
    follow();
    dark.addEventListener("change", follow);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function showBanner(text) {
    var b = $("banner");
    b.textContent = text || "";
    b.classList.toggle("show", !!text);
  }

  // WARNING: CPA bans the client IP for 30 minutes after 5 rejected management keys, and behind a
  // proxy that is every client. Never send an empty key, and stop sending a rejected one until
  // the field changes.
  var keyRejected = false;
  function keyBlocked() {
    if (keyInput.value.trim() !== "" && !keyRejected) return null;
    authFail();
    var e = new Error("Management key required or invalid");
    e.auth = true;
    return e;
  }

  function authFail() {
    $("keybox").classList.remove("hidden");
    var has = keyInput.value.trim() !== "";
    showBanner(has
      ? "Management key rejected. Fix it above; nothing is sent until it changes."
      : "Enter the management key above.");
    keyInput.classList.add("attn");
    keyInput.focus();
  }

  function api(method, path, body) {
    var blocked = keyBlocked();
    if (blocked) return Promise.reject(blocked);
    var headers = { "Authorization": "Bearer " + keyInput.value.trim() };
    var opts = { method: method, headers: headers };
    if (body !== undefined) {
      headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    return fetch(API + path, opts).then(function (res) {
      return res.text().then(function (txt) {
        var data = null;
        try { data = txt ? JSON.parse(txt) : null; } catch (e) {}
        if (res.status === 401) {
          keyRejected = true;
          authFail();
          var e401 = new Error("Management key required or invalid");
          e401.auth = true;
          throw e401;
        }
        if (!res.ok || (data && data.error)) {
          throw new Error((data && data.error) || ("HTTP " + res.status + (txt && !data ? ": " + txt.slice(0, 200) : "")));
        }
        return data || {};
      });
    });
  }

  // After the model set changes (add/remove), trigger a CPA config reload so the models are
  // re-pulled into /v1/models (and thus Claude Code's model picker). This writes a changing nonce
  // under this plugin's own config block via CPA's config API, which saves preserving comments and
  // reloads. Best-effort: a failure just means the picker refreshes on the next CPA reload.
  function syncModels() {
    if (keyBlocked()) return Promise.resolve();
    return fetch("/v8/management/config", {
      method: "PATCH",
      headers: { "Authorization": "Bearer " + keyInput.value.trim(), "Content-Type": "application/json" },
      body: JSON.stringify({ plugins: { configs: { "deepinfra-autoscale": { "sync-nonce": Date.now() } } } })
    }).catch(function () {});
  }

  /* ---------- formatting ---------- */
  function fmtContext(n) {
    n = Number(n);
    if (!isFinite(n) || n <= 0) return "-";
    if (n % 1048576 === 0) return (n / 1048576) + "M";
    if (n % 1024 === 0) return (n / 1024) + "k";
    if (n >= 1000) return (n / 1000).toFixed(n % 1000 ? 1 : 0) + "k";
    return String(n);
  }

  function parseContext(s) {
    var m = /^\s*(\d+(?:\.\d+)?)\s*([kKmM]?)\s*$/.exec(s);
    if (!m) return null;
    var v = parseFloat(m[1]), u = m[2].toLowerCase();
    if (u === "k") v *= 1024;
    else if (u === "m") v *= 1048576;
    v = Math.round(v);
    return v > 0 ? v : null;
  }

  function parseNumGpus(name) {
    var m = /^(\d+)\s*x/i.exec(name || "");
    return m ? parseInt(m[1], 10) : 1;
  }

  function relTime(unix) {
    unix = Number(unix);
    if (!unix || unix <= 0) return "never";
    var s = Math.max(0, Math.floor(Date.now() / 1000 - unix));
    if (s < 45) return "just now";
    var m = Math.round(s / 60);
    if (m < 60) return m + "m ago";
    var h = Math.floor(s / 3600);
    if (h < 48) return h + "h ago";
    return Math.floor(s / 86400) + "d ago";
  }

  function money(n) { return "$" + (Number(n) || 0).toFixed(2); }

  function statusClass(st) {
    switch (st) {
      case "running": return "green";
      case "deploying": case "downloading": return "amber";
      case "failed": return "red";
      default: return "gray";
    }
  }

  /* ---------- rendering ---------- */
  function renderGpuOptions() {
    var sig = JSON.stringify(state.gpus);
    if (sig === gpuSig) return;
    gpuSig = sig;
    var sel = $("f-gpu");
    var prev = sel.value;
    sel.textContent = "";
    var ph = el("option", null, state.gpus.length ? "Select a GPU..." : "No GPUs available");
    ph.value = "";
    sel.appendChild(ph);
    state.gpus.forEach(function (g) {
      var o = el("option", null, g.name + " - " + money(g.usd_per_hour) + "/hr" + (g.available ? "" : " (unavailable)"));
      o.value = g.name;
      o.disabled = !g.available;
      sel.appendChild(o);
    });
    if (prev) sel.value = prev;
  }

  function renderCost() {
    var total = 0;
    state.models.forEach(function (m) {
      if (m.status === "running") total += Number(m.usd_per_hour) || 0;
    });
    $("cost").textContent = money(total);
  }

  function renderList() {
    var box = $("list");
    box.textContent = "";
    $("meta").textContent = state.idle != null ? "Idle window: " + state.idle + " min" : "";
    if (!state.models.length) {
      box.appendChild(el("div", "empty", "No models yet"));
      return;
    }
    var table = el("table");
    var thead = el("thead"), hr = el("tr");
    ["Model", "HF repo", "GPU", "Context", "Status", "Last used", "Actions"].forEach(function (h) {
      hr.appendChild(el("th", null, h));
    });
    thead.appendChild(hr); table.appendChild(thead);
    var tbody = el("tbody");

    state.models.forEach(function (m) {
      var tr = el("tr");

      var tdId = el("td");
      if (m.display_name) tdId.appendChild(el("div", null, m.display_name));
      tdId.appendChild(el("div", m.display_name ? "sub mono" : "mono", m.id));
      tr.appendChild(tdId);

      var tdRepo = el("td");
      tdRepo.appendChild(el("div", "mono", m.hf_repo || "-"));
      if (m.revision) tdRepo.appendChild(el("div", "sub mono", "@" + String(m.revision).slice(0, 8)));
      tr.appendChild(tdRepo);

      var tdGpu = el("td");
      tdGpu.appendChild(el("div", null, m.gpu || "-"));
      tdGpu.appendChild(el("div", "sub", money(m.usd_per_hour) + "/hr"));
      tr.appendChild(tdGpu);

      tr.appendChild(el("td", null, fmtContext(m.context)));

      var tdSt = el("td");
      tdSt.appendChild(el("span", "badge " + statusClass(m.status), m.status || "unknown"));
      tr.appendChild(tdSt);

      var tdLast = el("td", "muted", relTime(m.last_used_unix));
      if (Number(m.last_used_unix) > 0) tdLast.title = new Date(m.last_used_unix * 1000).toLocaleString();
      tr.appendChild(tdLast);

      var tdAct = el("td");
      var acts = el("div", "actions");
      var busy = !!state.busy[m.id];
      var wake = el("button", null, "Wake");
      wake.type = "button";
      wake.disabled = busy || m.status === "running" || m.status === "deploying" || m.status === "downloading";
      wake.addEventListener("click", function () { rowAction(m.id, "/wake?id=", "POST"); });
      var sleep = el("button", null, "Sleep");
      sleep.type = "button";
      sleep.disabled = busy || m.status === "scaled-to-zero" || m.status === "idle";
      sleep.addEventListener("click", function () { rowAction(m.id, "/sleep?id=", "POST"); });
      var rm = el("button", "danger", "Remove");
      rm.type = "button";
      rm.disabled = busy;
      rm.addEventListener("click", function () {
        if (confirm("Remove model \"" + m.id + "\"? This releases its GPUs and deletes the entry.")) {
          rowAction(m.id, "", "DELETE");
        }
      });
      acts.appendChild(wake); acts.appendChild(sleep); acts.appendChild(rm);
      tdAct.appendChild(acts);
      if (state.rowErr[m.id]) tdAct.appendChild(el("div", "row-err", state.rowErr[m.id]));
      tr.appendChild(tdAct);

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    box.appendChild(table);
  }

  /* ---------- data ---------- */
  var loading = false;
  function load() {
    if (loading) return Promise.resolve();
    loading = true;
    return api("GET", "/models").then(function (d) {
      state.models = Array.isArray(d.models) ? d.models : [];
      state.gpus = Array.isArray(d.gpus) ? d.gpus : [];
      state.idle = d.idle_minutes != null ? d.idle_minutes : null;
      $("s-key").placeholder = d.api_key_set ? "Saved (type to replace)" : "Not set";
      showBanner(!d.api_key_set ? "Add your DeepInfra API key under Settings to get started." : d.deepinfra_error ? "Can't reach DeepInfra, so model status is unknown (check the API key under Settings): " + d.deepinfra_error : "");
      keyInput.classList.remove("attn");
      renderGpuOptions(); renderCost(); renderList();
    }).catch(function (e) {
      if (!e.auth) showBanner("Failed to load models: " + e.message);
    }).then(function () { loading = false; });
  }

  function rowAction(id, suffix, method) {
    state.busy[id] = true;
    delete state.rowErr[id];
    renderList();
    var path = "/models" + (method === "DELETE" ? "?id=" + encodeURIComponent(id) : suffix + encodeURIComponent(id));
    api(method, path).then(function () {
      if (method === "DELETE") return syncModels(); // model set changed -> refresh /v1/models
    }).catch(function (e) {
      state.rowErr[id] = e.message;
    }).then(function () {
      delete state.busy[id];
      return load();
    }).then(renderList);
  }

  /* ---------- form ---------- */
  function setFormMsg(text, kind) {
    var m = $("formmsg");
    m.textContent = text || "";
    m.className = "msg" + (kind ? " " + kind : "");
    m.style.margin = "0";
  }

  $("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var ctx = parseContext($("f-ctx").value);
    if (ctx == null) { setFormMsg("Invalid context length. Use e.g. 1048576, 1M or 256k.", "err"); return; }
    var gpu = $("f-gpu").value;
    if (!gpu) { setFormMsg("Select a GPU.", "err"); return; }
    var gen;
    try { gen = $("f-gen").value.trim() ? JSON.parse($("f-gen").value) : undefined; }
    catch (e) { setFormMsg("Default sampling must be a JSON object.", "err"); return; }
    var spec;
    try { spec = $("f-spec").value.trim() ? JSON.parse($("f-spec").value) : undefined; }
    catch (e) { setFormMsg("Speculative decoding must be a JSON object.", "err"); return; }
    var body = {
      id: $("f-id").value.trim(),
      display_name: $("f-name").value.trim(),
      hf_repo: $("f-repo").value.trim(),
      revision: $("f-rev").value.trim(),
      gpu: gpu,
      num_gpus: parseNumGpus(gpu),
      context: ctx,
      quantization: $("f-quant").value.trim(),
      tool_parser: $("f-tool").value.trim(),
      reasoning_parser: $("f-reason").value.trim(),
      enable_thinking: $("f-think").checked,
      generation_config: gen,
      speculative_config: spec
    };
    var btn = $("submit");
    btn.disabled = true;
    setFormMsg("Submitting...", "");
    api("POST", "/models", body).then(function (d) {
      setFormMsg("Model \"" + ((d.model && d.model.id) || body.id) + "\" added. It appears in Claude Code's /model picker after Claude Code restarts.", "ok");
      $("form").reset();
      return syncModels(); // refresh /v1/models so the model shows in the picker
    }).then(function () {
      return load();
    }).catch(function (e) {
      setFormMsg(e.message, "err");
    }).then(function () { btn.disabled = false; });
  });

  /* ---------- settings (stored in this plugin's CLIProxyAPI config) ---------- */
  var CONFIG = "/v8/management/config/plugins/configs/deepinfra-autoscale";
  function mgmt(method, body) {
    var blocked = keyBlocked();
    if (blocked) return Promise.reject(blocked);
    var opts = { method: method, headers: { "Authorization": "Bearer " + keyInput.value.trim() } };
    if (body !== undefined) {
      opts.headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    return fetch(CONFIG, opts).then(function (res) {
      if (res.status === 401) { keyRejected = true; authFail(); throw new Error("Management key required or invalid"); }
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    });
  }
  function setSettingsMsg(text, kind) {
    $("s-msg").textContent = text || "";
    $("s-msg").className = "msg" + (kind ? " " + kind : "");
  }
  function loadSettings() {
    return mgmt("GET").then(function (cfg) {
      $("s-idle").value = cfg["idle-minutes"] != null ? cfg["idle-minutes"] : "";
    }).catch(function () {});
  }
  function minutesField(id, label) {
    var v = $(id).value.trim();
    if (v === "") return null;
    if (!/^[0-9]+$/.test(v) || Number(v) <= 0) throw new Error(label + " must be a positive whole number of minutes.");
    return Number(v);
  }
  $("settings").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var idle;
    try {
      idle = minutesField("s-idle", "Idle window");
    } catch (e) { setSettingsMsg(e.message, "err"); return; }
    var apiKey = $("s-key").value.trim();
    $("s-save").disabled = true;
    setSettingsMsg("Saving...", "");
    (apiKey ? api("PUT", "/api-key", { api_key: apiKey }) : Promise.resolve()).then(function () {
      $("s-key").value = "";
      // NOTE: the endpoint replaces the whole plugin config, so merge into the current one.
      return mgmt("GET");
    }).then(function (cfg) {
      if (idle == null) delete cfg["idle-minutes"]; else cfg["idle-minutes"] = idle;
      return mgmt("PUT", cfg);
    }).then(function () {
      setSettingsMsg("Saved.", "ok");
      return loadSettings();
    }).then(function () {
      return load();
    }).catch(function (e) {
      setSettingsMsg(e.message, "err");
    }).then(function () { $("s-save").disabled = false; });
  });

  keyInput.addEventListener("input", function () {
    keyRejected = false;
    try { localStorage.setItem(KEY_NAME, keyInput.value); } catch (e) {}
  });
  keyInput.addEventListener("change", function () { load().then(loadSettings); });
  $("refresh").addEventListener("click", function () { load(); });

  load().then(loadSettings);
  setInterval(load, 15000);
  setInterval(renderList, 30000);
})();
</script>
</body>
</html>
